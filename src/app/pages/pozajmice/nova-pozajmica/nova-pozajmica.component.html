<ion-header>
  <ion-toolbar>
    <ion-title>Nova pozajmica</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="odustani()">Zatvori</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #forma="ngForm" (ngSubmit)="potvrdi(forma)">
    <ion-list>

      <ion-item>
        <ion-input
          label="Dužnik"
          labelPlacement="floating"
          type="text"
          name="duznik"
          ngModel
          required
          maxlength="60">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Iznos (RSD)"
          labelPlacement="floating"
          type="number"
          name="iznos"
          ngModel
          required
          min="1">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Datum</ion-label>
        <ion-datetime-button datetime="datumPozajmice"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="datumPozajmice"
              presentation="date"
              name="datum"
              [ngModel]="danas"
              required>
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Napomena"
          labelPlacement="floating"
          name="opis"
          ngModel
          rows="3"
          maxlength="200">
        </ion-textarea>
      </ion-item>

    </ion-list>

    <ion-button
      type="submit"
      expand="block"
      class="ion-margin-top"
      [disabled]="!forma.valid">
      Sačuvaj
    </ion-button>
  </form>
</ion-content>
