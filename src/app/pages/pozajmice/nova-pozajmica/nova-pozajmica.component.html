<ion-header>
  <ion-toolbar>
    <ion-title>{{ naslov }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="odustani()">Zatvori</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #forma="ngForm" (ngSubmit)="potvrdi(forma)">
    <ion-list>

      <ion-item>
        <ion-input
          label="Dužnik"
          labelPlacement="floating"
          type="text"
          name="duznik"
          [(ngModel)]="duznik"
          required
          maxlength="60">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Iznos (RSD)"
          labelPlacement="floating"
          type="number"
          name="iznos"
          [(ngModel)]="iznos"
          required
          [min]="najmanjiIznos"
          #iznosKontrola="ngModel">
        </ion-input>
      </ion-item>
      <ion-note color="danger" class="ion-padding-start"
        *ngIf="iznosKontrola.invalid && iznosKontrola.touched && rezimIzmene">
        Iznos ne može biti manji od već vraćenog dela ({{ najmanjiIznos | number }} RSD).
      </ion-note>

      <ion-item>
        <ion-label position="stacked">Datum</ion-label>
        <ion-datetime-button datetime="datumPozajmice"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="datumPozajmice"
              presentation="date"
              name="datum"
              [(ngModel)]="datum"
              required>
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Napomena"
          labelPlacement="floating"
          name="opis"
          [(ngModel)]="opis"
          rows="3"
          maxlength="200">
        </ion-textarea>
      </ion-item>

    </ion-list>

    <ion-button
      type="submit"
      expand="block"
      class="ion-margin-top"
      [disabled]="!forma.valid">
      {{ rezimIzmene ? 'Sačuvaj izmene' : 'Sačuvaj' }}
    </ion-button>
  </form>
</ion-content>
